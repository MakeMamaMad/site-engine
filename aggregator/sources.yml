    enabled: true
    kind: rss
    title: "Сделано у нас — российское производство техники"
    url: "https://sdelanounas.ru/index/rss/"
    include_keywords: ["грузов", "тягач", "полуприцеп", "прицеп", "спецтехн", "самосвал", "камаз", "«урал", "автозавод", "маз", "нефаз", "тонар", "автокран", "манипулятор", "шасси", "коммунальн", "автобус", "мусоровоз", "бетоносмесит", "автоцистерн"]
