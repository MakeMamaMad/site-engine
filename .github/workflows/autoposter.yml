name: Video — Generate & Publish (YouTube + TikTok + Instagram)

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Какой слот запустить: manual, am или pm"
        required: false
        default: "manual"
      content:
        description: "Что снимать: news, sat (партнёрский ролик SAT), testdrive (запись на тест-драйв SAT) или guide (полезный ролик по статье)"
        required: false
        default: "news"
  schedule:
    # Primary schedule, UTC. Moscow time is UTC+3 year-round.
    - cron: "30 7 * * *"   # 10:30 MSK
    - cron: "30 15 * * *"  # 18:30 MSK
  workflow_run:
    workflows: ["News — Fetch & Publish"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: social-shorts-v2
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide daily video slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REQUESTED_SLOT: ${{ github.event.inputs.slot }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("SCHEDULE_EXPR", "")
          conclusion = os.environ.get("WORKFLOW_RUN_CONCLUSION", "")
          requested_slot = os.environ.get("REQUESTED_SLOT", "").strip()
          now = datetime.now(ZoneInfo("Europe/Moscow"))
          today = now.date().isoformat()
          hour = now.hour

          slot = ""
          should_run = False

          if event == "workflow_dispatch":
              slot = requested_slot if requested_slot in {"am", "pm"} else "manual"
              should_run = True
          elif event == "schedule":
              if schedule == "30 7 * * *":
                  slot = "am"
              elif schedule == "30 15 * * *":
                  slot = "pm"
              should_run = bool(slot)
          elif event == "workflow_run" and conclusion == "success":
              # Fallback: if GitHub drops/delays the dedicated video cron,
              # the already reliable news ingest workflow can recover the slot.
              if 9 <= hour < 15:
                  slot = "am"
              elif 17 <= hour < 23:
                  slot = "pm"

              if slot:
                  state_path = Path("tools/autoposter/state/video_schedule.json")
                  state = {}
                  if state_path.exists():
                      try:
                          state = json.loads(state_path.read_text(encoding="utf-8"))
                      except Exception:
                          state = {}
                  done = ((state.get("days") or {}).get(today) or {}).get(slot) == "published"
                  should_run = not done

          # Dedicated cron and watchdog dispatches respect the persisted slot state.
          if event in {"schedule", "workflow_dispatch"} and slot in {"am", "pm"}:
              state_path = Path("tools/autoposter/state/video_schedule.json")
              state = {}
              if state_path.exists():
                  try:
                      state = json.loads(state_path.read_text(encoding="utf-8"))
                  except Exception:
                      state = {}
              done = ((state.get("days") or {}).get(today) or {}).get(slot) == "published"
              should_run = should_run and not done

          print(f"event={event} moscow={now.isoformat()} slot={slot or 'none'} should_run={should_run}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"slot={slot}\n")
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

  publish:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/autoposter/requirements.txt

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install deps
        run: pip install -r tools/autoposter/requirements.txt

      - name: Restore YouTube credentials
        env:
          YT_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          cd tools/autoposter
          test -n "$YT_TOKEN_B64"
          printf '%s' "$YT_TOKEN_B64" | base64 -d > youtube_token.json
          test -s youtube_token.json

      - name: Generate AI Short v2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_SCRIPT: "1"
          AI_IMAGES: "1"
          OPENAI_TEXT_MODEL: "gpt-5.6-luna"
          OPENAI_IMAGE_MODEL: "gpt-image-2.5-sunburst"
          OPENAI_IMAGE_QUALITY: "medium"
          OPENAI_IMAGE_SIZE: "1024x1792"
          OPENAI_TTS: "1"
          OPENAI_TTS_MODEL: "gpt-4o-mini-tts"
          OPENAI_TTS_VOICE: "coral"
          TTS_ENGINE: "edge"
          VOICE: "ru-RU-SvetlanaNeural"
          TTS_RATE: "+5%"
          V2_MARK_USED: "0"
          GROWTH_AGENT_ENABLED: ${{ vars.GROWTH_AGENT_ENABLED || '0' }}
          V2_MAX_AGE_HOURS: "96"
          SITE_URL: "https://spec-avtoportal.ru/"
          CONTENT_JSON_PATH: ${{ github.workspace }}/frontend/data/news.json
          VIDEO_SLOT: ${{ needs.gate.outputs.slot }}
          REQUESTED_CONTENT: ${{ github.event.inputs.content }}
        run: |
          # Weekly series on the evening slot: Monday — a useful short from our
          # articles/calculators, Thursday — partner short about SAT trailers.
          WEEKDAY="$(TZ=Europe/Moscow date +%u)"
          # Tuesday and Thursday evenings — SAT Test Drive promo (when its
          # config is "active"; otherwise the Thursday slot keeps the SAT catalog short).
          TESTDRIVE_ACTIVE="$(python -c "import json;print(json.load(open('promotion/config/sat_testdrive_shorts.json')).get('active', False))")"
          if [ "$REQUESTED_CONTENT" = "sat" ] || [ "$REQUESTED_CONTENT" = "guide" ] || [ "$REQUESTED_CONTENT" = "testdrive" ]; then
            export V2_CONTENT="$REQUESTED_CONTENT"
          elif [ "$VIDEO_SLOT" = "pm" ] && { [ "$WEEKDAY" = "2" ] || [ "$WEEKDAY" = "4" ]; } && [ "$TESTDRIVE_ACTIVE" = "True" ]; then
            export V2_CONTENT=testdrive
          elif [ "$VIDEO_SLOT" = "pm" ] && [ "$WEEKDAY" = "4" ]; then
            export V2_CONTENT=sat
          elif [ "$VIDEO_SLOT" = "pm" ] && [ "$WEEKDAY" = "1" ]; then
            export V2_CONTENT=guide
          fi
          cd tools/autoposter
          python -m src.v2_main

      - name: Publish temporary media for Buffer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="buffer-media"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Buffer temporary media" --notes "Temporary media used by the social autoposter." --prerelease
          fi

          TIKTOK_ASSET="tiktok-${GITHUB_RUN_ID}.mp4"
          INSTAGRAM_ASSET="instagram-${GITHUB_RUN_ID}.mp4"
          cp tools/autoposter/out_v2/tiktok.mp4 "/tmp/$TIKTOK_ASSET"
          cp tools/autoposter/out_v2/master.mp4 "/tmp/$INSTAGRAM_ASSET"
          gh release upload "$RELEASE_TAG" "/tmp/$TIKTOK_ASSET#$TIKTOK_ASSET" "/tmp/$INSTAGRAM_ASSET#$INSTAGRAM_ASSET" --clobber

          echo "BUFFER_TIKTOK_VIDEO_URL=https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$TIKTOK_ASSET" >> "$GITHUB_ENV"
          echo "BUFFER_INSTAGRAM_VIDEO_URL=https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$INSTAGRAM_ASSET" >> "$GITHUB_ENV"

      - name: Publish YouTube TikTok Instagram
        env:
          SITE_URL: "https://spec-avtoportal.ru/"
          SOCIAL_PLATFORMS: "youtube,tiktok,instagram"
          SOCIAL_STRICT: "1"

          YOUTUBE_TOKEN_FILE: "youtube_token.json"
          YOUTUBE_CLIENT_SECRETS: "client_secrets.json"
          YOUTUBE_PRIVACY: "public"

          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_NAME: "specavtoportal"
          BUFFER_INSTAGRAM_CHANNEL_NAME: "specavtoportal"
          BUFFER_TIKTOK_VIDEO_URL: ${{ env.BUFFER_TIKTOK_VIDEO_URL }}
          BUFFER_INSTAGRAM_VIDEO_URL: ${{ env.BUFFER_INSTAGRAM_VIDEO_URL }}
          BUFFER_PUBLISH_WAIT_SECONDS: "120"
        run: |
          cd tools/autoposter
          python -m src.publish.social_v2

      - name: Mark daily slot published
        if: success() && needs.gate.outputs.slot != 'manual'
        env:
          VIDEO_SLOT: ${{ needs.gate.outputs.slot }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("tools/autoposter/state/video_schedule.json")
          state = {}
          if path.exists():
              try:
                  state = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  state = {}
          state.setdefault("schema", 1)
          state.setdefault("days", {})
          today = datetime.now(ZoneInfo("Europe/Moscow")).date().isoformat()
          day = state["days"].setdefault(today, {})
          day[os.environ["VIDEO_SLOT"]] = "published"

          # Keep state compact.
          for key in sorted(state["days"])[:-14]:
              state["days"].pop(key, None)

          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Marked {today} {os.environ['VIDEO_SLOT']} as published")
          PY

      - name: Commit social state
        if: always()
        run: |
          git config user.name "specavto-autoposter"
          git config user.email "actions@users.noreply.github.com"
          git add tools/autoposter/state/v2.json tools/autoposter/state/social_v2.json tools/autoposter/state/video_schedule.json || true
          if git diff --cached --quiet; then
            echo "No social state changes"
            exit 0
          fi
          git commit -m "autoposter: update social v2 state"
          git pull --rebase origin main
          git push origin main

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-shorts-v2-output-${{ github.run_id }}
          path: tools/autoposter/out_v2/*
          if-no-files-found: ignore
          retention-days: 7
