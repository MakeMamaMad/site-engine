name: Checks — Full QA

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ redesign-v1, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install visual QA deps
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow feedparser beautifulsoup4 PyYAML python-dateutil

      - name: Python syntax
        run: |
          python -m py_compile tools/build_seo.py aggregator/main.py aggregator/post_to_telegram.py aggregator/post_to_vk.py aggregator/telegram_visual.py aggregator/translate_news.py tools/daily_digest/agent.py tools/autoposter/src/ai/storyboard.py tools/autoposter/src/ai/visuals.py tools/autoposter/src/render/short_v2.py tools/autoposter/src/v2_main.py tools/autoposter/src/publish/instagram.py tools/autoposter/src/publish/instagram_discover.py tools/autoposter/src/publish/tiktok.py tools/autoposter/src/publish/social_v2.py promotion/core/placements.py promotion/jobs/verify_placements.py promotion/core/manual_queue.py promotion/core/telegram_failover.py promotion/outreach_telegram_ad_bots.py tools/send_manual_outreach_digest.py tools/send_ops_report_telegram.py tools/send_daily_control_report.py tools/telegram_control.py tools/publish_control_schedule.py tools/video_schedule_watchdog.py tools/social_schedule_watchdog.py tools/promotion_schedule_watchdog.py tools/fetch_promotion_metrika.py tools/fetch_site_analytics.py tools/fetch_traffic_breakdown.py tools/axle_calculator.py tools/rto_calculator.py tools/load_distribution_calculator.py tools/fine_calculator.py tools/pallet_calculator.py tools/trip_cost_calculator.py tools/tools_hub.py promotion/publish_channel_posts.py promotion/build_editorial_promo.py promotion/run_editorial_campaign.py promotion/publish_mexzona.py

      - name: Validate incremental translation
        run: |
          python - <<'PY'
          import copy
          import importlib.util

          spec = importlib.util.spec_from_file_location("translator", "aggregator/translate_news.py")
          translator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(translator)

          assert translator.required_argos_pairs({"en"}) == {("en", "ru")}
          assert translator.required_argos_pairs({"de"}) == {("de", "en"), ("en", "ru")}
          assert translator.required_argos_pairs({"pl", "en"}) == {("pl", "en"), ("en", "ru")}

          fresh_foreign = {
              "domain": "globaltrailermag.com",
              "title": "Trailer market expands",
              "summary": "Manufacturers report higher demand.",
          }
          assert len(translator.candidate_items([fresh_foreign])) == 1

          translated = copy.deepcopy(fresh_foreign)
          translated.update({
              "title": "Рынок прицепов расширяется",
              "summary": "Производители сообщают о росте спроса.",
              "translation_status": "ru",
              "translation_source_lang": "en",
          })
          assert translator.candidate_items([translated]) == []

          import aggregator.main as collector
          current = [copy.deepcopy(fresh_foreign)]
          existing = [{
              **translated,
              "link": "https://globaltrailermag.com/example",
          }]
          current[0]["link"] = "https://globaltrailermag.com/example"
          collector.preserve_stable_identity(current, existing)
          assert current[0]["title"] == translated["title"]
          assert current[0]["summary"] == translated["summary"]
          assert current[0]["translation_status"] == "ru"

          legacy_current = [{
              "domain": "trucknews.com",
              "title": "New trailer technology",
              "summary": "A new system was unveiled.",
              "link": "https://trucknews.com/legacy",
          }]
          legacy_existing = [{
              "domain": "trucknews.com",
              "title": "Новая технология для прицепов",
              "summary": "Представлена новая система.",
              "link": "https://trucknews.com/legacy",
          }]
          collector.preserve_stable_identity(legacy_current, legacy_existing)
          assert legacy_current[0]["translation_status"] == "ru"
          assert legacy_current[0]["title"].startswith("Новая технология")
          print("Incremental translation preservation OK")
          PY

      - name: Validate VK Editorial v1
        run: |
          python aggregator/post_to_vk.py --self-test
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("aggregator/vk_config.json").read_text("utf-8"))
          state = json.loads(Path("frontend/data/vk_state.json").read_text("utf-8"))

          assert config.get("schema") == 1
          assert config.get("enabled") is True, "VK publishing should be live after token setup"
          assert config.get("community_screen_name") == "specavtoportal"
          assert "live" in config.get("note", "").lower()
          assert len(str(config.get("baseline_ref") or "")) == 40
          assert "immediate_score" not in config
          assert 1 <= int(config.get("max_immediate_per_run") or 0) <= 3
          assert config.get("digest_enabled") is True
          assert int(config.get("digest_items") or 0) == 3
          assert int(config.get("digest_min_items") or 0) == 3
          assert state.get("schema") == 1
          assert isinstance(state.get("posts"), dict)
          assert isinstance(state.get("digested"), dict)
          assert isinstance(state.get("digests"), dict)
          print("VK Editorial v1 live config OK")
          PY

      - name: Render Telegram visual samples
        run: |
          python aggregator/telegram_visual.py --type important --output /tmp/important.png --title "Новый ГОСТ вступил в силу" --summary "Что изменилось для перевозчиков и как подготовиться"
          python aggregator/telegram_visual.py --type digest --slot am --output /tmp/digest.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ("important.png", "digest.png"):
              path = Path("/tmp") / name
              assert path.exists() and path.stat().st_size > 10000, f"visual missing or too small: {name}"
              with Image.open(path) as image:
                  assert image.size == (1080, 1080), f"wrong size: {name} {image.size}"
                  assert image.mode == "RGB", f"wrong mode: {name} {image.mode}"
          print("Telegram visual render OK")
          PY

      - name: Telegram reboot config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("aggregator/telegram_config.json").read_text("utf-8"))
          state = json.loads(Path("frontend/data/telegram_state.json").read_text("utf-8"))

          assert config.get("schema") == 2
          assert config.get("enabled") is True, "Telegram publishing should be live"
          assert len(str(config.get("baseline_ref") or "")) == 40, "Telegram baseline_ref must be a commit SHA"
          assert 1 <= int(config.get("max_immediate_per_run") or 0) <= 3
          assert "immediate_score" not in config
          assert 24 <= int(config.get("max_item_age_hours") or 0) <= 72
          assert config.get("digest_enabled") is True
          assert int(config.get("digest_items") or 0) == 3
          assert int(config.get("digest_min_items") or 0) == 3
          assert config.get("digest_times") == ["09:30", "19:30"]

          assert state.get("schema") in (1, 2), "state must be migratable to editorial schema"
          assert isinstance(state.get("posts"), dict)
          assert isinstance(state.get("digested", {}), dict)
          assert isinstance(state.get("digests", {}), dict)
          welcome_id = state.get("welcome_message_id")
          assert welcome_id is None or isinstance(welcome_id, int), "welcome_message_id must be null or int"
          for key, post in state.get("posts", {}).items():
              assert key
              assert isinstance(post, dict)
              assert isinstance(post.get("message_id"), int)

          import importlib.util
          spec = importlib.util.spec_from_file_location("tgpub", "aggregator/post_to_telegram.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          sample = {"title": "Обычная свежая новость", "summary": "", "link": "https://example.com/news"}
          assert "ВАЖНО" not in mod.build_text(sample, "https://spec-avtoportal.ru/news/example/")
          assert "СпецАвтоПортал" in mod.build_text(sample, "https://spec-avtoportal.ru/news/example/")
          print("Telegram no-rating config OK")
          PY

      - name: Short Generator v2 self-test
        run: |
          cd tools/autoposter
          AI_IMAGES=0 AI_SCRIPT=0 python -m src.v2_main --self-test

      - name: Social publisher adapters self-test
        run: |
          cd tools/autoposter
          python - <<'PY'
          from src.publish.instagram import _graph_url
          from src.publish.tiktok import _chunk_plan

          assert _graph_url("123/media", api_version="v26.0") == "https://graph.facebook.com/v26.0/123/media"
          assert _chunk_plan(4 * 1024 * 1024) == (4 * 1024 * 1024, 1)
          chunk, count = _chunk_plan(100 * 1024 * 1024)
          assert 5 * 1024 * 1024 <= chunk <= 64 * 1024 * 1024
          assert count >= 2
          print("Social publisher adapters self-test OK")
          PY

      - name: Promotion core tests
        run: |
          python -m unittest promotion.tests.test_core promotion.tests.test_placements promotion.tests.test_telegram_failover promotion.tests.test_manual_outreach_digest promotion.tests.test_editorial_promotion promotion.tests.test_telegram_control promotion.tests.test_ops_report_content promotion.tests.test_control_schedule promotion.tests.test_video_schedule_watchdog promotion.tests.test_social_schedule_watchdog promotion.tests.test_promotion_schedule_watchdog promotion.tests.test_promotion_metrika promotion.tests.test_site_analytics promotion.tests.test_news_indexing promotion.tests.test_regulation_guide promotion.tests.test_channel_posts promotion.tests.test_editorial_pitch promotion.tests.test_axle_calculator promotion.tests.test_gmail_check_errors promotion.tests.test_yandex_recrawl promotion.tests.test_rto_calculator promotion.tests.test_traffic_breakdown promotion.tests.test_shorts_links promotion.tests.test_shorts_cta promotion.tests.test_sat_shorts promotion.tests.test_guide_shorts promotion.tests.test_load_distribution promotion.tests.test_fine_calculator promotion.tests.test_pallet_calculator promotion.tests.test_trip_cost

      - name: JavaScript syntax
        run: |
          node --check frontend/news.js
          node --check frontend/article.js

      - name: Build SEO pages
        run: |
          python tools/build_seo.py

      - name: Validate generated SEO output
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          root = pathlib.Path("frontend")
          items = json.loads((root / "data/news.json").read_text("utf-8"))
          assert isinstance(items, list) and items, "news.json must be a non-empty list"

          ids = [str(x.get("id") or "") for x in items]
          slugs = [str(x.get("slug") or "") for x in items]
          assert all(ids), "every item must have id"
          assert all(slugs), "every item must have slug"
          assert len(ids) == len(set(ids)), "ids must be unique"
          assert len(slugs) == len(set(slugs)), "slugs must be unique"

          pages = list((root / "news").glob("*/index.html"))
          assert len(pages) == len(items), f"expected {len(items)} article pages, got {len(pages)}"

          sample = pages[0].read_text("utf-8")
          for marker in ('rel="canonical"', 'application/ld+json', 'property="og:title"', 'name="description"'):
              assert marker in sample, f"missing SEO marker: {marker}"

          # Indexable news pages must never republish the scraped full source body.
          import importlib.util
          seo_spec = importlib.util.spec_from_file_location("seo_builder", "tools/build_seo.py")
          seo_builder = importlib.util.module_from_spec(seo_spec)
          seo_spec.loader.exec_module(seo_builder)
          seo_builder.mark_duplicate_news(items)  # same step as the build: older duplicates are noindex
          # Two gates: "public" = shown on the site, hubs and RSS;
          # "indexable" = public AND has text of our own (translation, partner or editorial).
          public_items = [item for item in items if seo_builder.is_public_news(item)]
          indexable_items = [item for item in items if seo_builder.is_indexable_news(item)]
          blocked_items = [item for item in items if not seo_builder.is_indexable_news(item)]
          assert indexable_items, "quality gate unexpectedly blocked every news item"
          assert set(id(i) for i in indexable_items) <= set(id(i) for i in public_items), "indexable news must be a subset of public news"
          for item in indexable_items[:80]:
              page = root / "news" / str(item["slug"]) / "index.html"
              assert 'content="index,follow,max-image-preview:large"' in page.read_text("utf-8"), f"indexable page robots mismatch: {page}"
          for item in public_items[:160]:
              page = root / "news" / str(item["slug"]) / "index.html"
              page_html = page.read_text("utf-8")
              full = seo_builder.strip_html(str(item.get("content") or item.get("content_text") or item.get("full_text") or ""))
              summary = seo_builder.summary_text(item)
              if len(full) > len(summary) + 300:
                  distinctive = full[min(220, len(full)):min(420, len(full))].strip()
                  if len(distinctive) >= 80:
                      assert distinctive not in page_html, f"scraped full text leaked into public article: {page}"
          for item in blocked_items[:80]:
              page = root / "news" / str(item["slug"]) / "index.html"
              assert 'content="noindex,follow"' in page.read_text("utf-8"), f"quality-blocked page must be noindex: {page}"

          compact_index = root / "data" / "news-index.json"
          assert compact_index.exists(), "lightweight news-index.json not generated"
          compact_items = json.loads(compact_index.read_text("utf-8"))
          assert len(compact_items) == len(public_items), "news-index must contain exactly the public items"
          assert compact_index.stat().st_size < (root / "data" / "news.json").stat().st_size, "news-index must be smaller than raw news.json"
          assert all("content" not in item and "full_text" not in item for item in compact_items), "news-index must not expose source full text"

          home_html = (root / "index.html").read_text("utf-8")
          assert 'id="seo-news-bootstrap"' in home_html, "homepage bootstrap missing"
          assert '<div id="news-list" class="news-list"><!-- SEO_NEWS_LIST_START --><article' in home_html, "homepage news must be statically rendered"
          assert 'featured-primary' in home_html and '<!-- SEO_FEATURED_PRIMARY_START -->' in home_html, "homepage featured content must be statically rendered"
          linked_news_pages = sum(
              1 for page in pages
              if 'Полезно по теме' in page.read_text("utf-8")
          )
          assert linked_news_pages >= 20, f"expected internal knowledge links on many news pages, got {linked_news_pages}"

          sat_news_pages = 0
          for item in items:
              page = root / "news" / str(item["slug"]) / "index.html"
              page_html = page.read_text("utf-8")
              is_sat_source = (
                  "satpricep.by" in str(item.get("domain") or "").lower()
                  or "satpricep" in str(item.get("source") or "").lower()
                  or "партнёр" in [str(x).lower() for x in (item.get("tags") or [])]
              )
              if 'sat-recommendation' in page_html:
                  sat_news_pages += 1
                  assert not is_sat_source, f"SAT source page must not receive duplicate partner ad: {page}"
                  assert 'rel="sponsored noopener"' in page_html, f"SAT ad must be sponsored: {page}"
          assert sat_news_pages >= 1, "expected at least one contextual SAT recommendation in news"

          knowledge_data = json.loads((root / "data/knowledge_articles.json").read_text("utf-8"))
          knowledge_items = knowledge_data.get("items", [])
          assert len(knowledge_items) >= 6, f"expected at least 6 evergreen knowledge articles, got {len(knowledge_items)}"
          knowledge_slugs = [str(x.get("slug") or "") for x in knowledge_items]
          assert all(knowledge_slugs), "every knowledge article needs slug"
          assert len(knowledge_slugs) == len(set(knowledge_slugs)), "knowledge slugs must be unique"

          knowledge_pages = list((root / "knowledge").glob("*/index.html"))
          assert len(knowledge_pages) == len(knowledge_items), f"expected {len(knowledge_items)} knowledge pages, got {len(knowledge_pages)}"
          knowledge_pages_with_news = 0
          for page in knowledge_pages:
              page_html = page.read_text("utf-8")
              for marker in ('rel="canonical"', 'application/ld+json', 'name="description"', 'База знаний'):
                  assert marker in page_html, f"knowledge article missing marker {marker}: {page}"
              if 'Свежие новости' in page_html:
                  knowledge_pages_with_news += 1
          assert knowledge_pages_with_news >= 5, f"expected news cross-links on knowledge pages, got {knowledge_pages_with_news}"

          chooser_page = root / "knowledge" / "kak-vybrat-polupricep" / "index.html"
          chooser_html = chooser_page.read_text("utf-8")
          assert 'sat-recommendation' in chooser_html, "trailer selection article must contain SAT recommendation"
          for model in ("SAT500", "SAT150", "SAT600", "SAT183 / SAT186"):
              assert model in chooser_html, f"missing SAT model in selection guide: {model}"
          assert 'rel="sponsored noopener"' in chooser_html, "SAT knowledge links must be sponsored"

          regulations_data = json.loads((root / "data/regulations.json").read_text("utf-8"))
          regulation_items = regulations_data.get("items", [])
          assert regulation_items, "regulations catalog must not be empty"
          regulation_slugs = [str(x.get("slug") or "") for x in regulation_items]
          assert all(regulation_slugs), "every active regulation must have slug"
          assert len(regulation_slugs) == len(set(regulation_slugs)), "regulation slugs must be unique"
          assert all(str(x.get("status") or "") == "Действует" for x in regulation_items), "public regulations must be active"
          assert all("example.com" not in str(x.get("official_url") or "") for x in regulation_items), "test regulation URLs are forbidden"
          assert all(str(x.get("official_url") or "").startswith("https://") for x in regulation_items), "every regulation needs an HTTPS official URL"
          assert regulations_data.get("verified_at"), "regulations need verified_at"

          regulations_dir = root / "regulations"
          regulation_pages = list(regulations_dir.glob("*/index.html"))
          assert len(regulation_pages) == len(regulation_items), f"expected {len(regulation_items)} regulation pages, got {len(regulation_pages)}"
          regulations_with_practice = 0
          for page in regulation_pages:
              regulation_html = page.read_text("utf-8")
              for marker in ('rel="canonical"', 'application/ld+json', 'name="description"', 'Открыть официальный документ'):
                  assert marker in regulation_html, f"regulation page missing marker {marker}: {page}"
              if 'Практические материалы' in regulation_html:
                  regulations_with_practice += 1
          assert regulations_with_practice == len(regulation_pages), "every active regulation should link to practical knowledge"

          law_html = (root / "law.html").read_text("utf-8")
          for marker in ('rel="canonical"', 'application/ld+json', 'Последняя проверка редакцией'):
              assert marker in law_html, f"law catalog missing marker: {marker}"

          knowledge = root / "knowledge.html"
          assert knowledge.exists(), "knowledge.html missing"
          knowledge_html = knowledge.read_text("utf-8")
          for marker in ('rel="canonical"', 'name="description"', 'База знаний'):
              assert marker in knowledge_html, f"knowledge page missing marker: {marker}"
          for slug in knowledge_slugs:
              assert f'href="/knowledge/{slug}/"' in knowledge_html, f"knowledge card not linked: {slug}"

          video_html = (root / "video.html").read_text("utf-8")
          assert 'noindex,follow' in video_html, "video page must be noindex"
          assert '/knowledge.html' in video_html, "video page must point to knowledge base"

          sitemap = root / "sitemap.xml"
          news_sitemap = root / "news-sitemap.xml"
          robots = root / "robots.txt"
          assert sitemap.exists(), "sitemap.xml not generated"
          assert news_sitemap.exists(), "news-sitemap.xml not generated"
          assert robots.exists(), "robots.txt not generated"
          ET.parse(sitemap)
          ET.parse(news_sitemap)
          sitemap_text = sitemap.read_text("utf-8")
          for item in blocked_items[:200]:
              assert f"/news/{item['slug']}/<" not in sitemap_text, f"noindex news listed in sitemap: {item['slug']}"
          robots_text = robots.read_text("utf-8")
          assert "Sitemap: https://spec-avtoportal.ru/sitemap.xml" in robots_text
          assert "Sitemap: https://spec-avtoportal.ru/news-sitemap.xml" in robots_text
          assert "Disallow: /data/" in robots_text

          topic_slugs = [
              "rynok-i-proizvodstvo",
              "gruzovaya-tehnika",
              "pritsepnaya-tehnika",
              "sobytiya-otrasli",
              "novye-tehnologii",
              "tamozhnya-i-logistika",
          ]
          for slug in topic_slugs:
              topic_page = root / "topics" / slug / "index.html"
              assert topic_page.exists(), f"topic page not generated: {slug}"
              topic_html = topic_page.read_text("utf-8")
              for marker in ('rel="canonical"', 'application/ld+json', 'name="description"'):
                  assert marker in topic_html, f"topic {slug} missing SEO marker: {marker}"

          brand_slugs = [
              "satpricep",
              "krone",
              "maz",
              "kamaz",
              "kogel",
              "mercedes-benz-trucks",
              "schmitz-cargobull",
              "saf-holland",
              "bpw",
          ]
          brand_directory = root / "brands" / "index.html"
          assert brand_directory.exists(), "brand directory not generated"
          directory_html = brand_directory.read_text("utf-8")
          for marker in ('rel="canonical"', 'application/ld+json', 'name="description"'):
              assert marker in directory_html, f"brand directory missing SEO marker: {marker}"

          for slug in brand_slugs:
              brand_page = root / "brands" / slug / "index.html"
              assert brand_page.exists(), f"brand page not generated: {slug}"
              brand_html = brand_page.read_text("utf-8")
              for marker in ('rel="canonical"', 'application/ld+json', 'name="description"'):
                  assert marker in brand_html, f"brand {slug} missing SEO marker: {marker}"

          urls = re.findall(r"<loc>(.*?)</loc>", sitemap.read_text("utf-8"))
          article_urls = [url for url in urls if "/news/" in url]
          assert len(article_urls) == len(indexable_items), "sitemap must contain exactly the quality-approved news URLs"
          for item in blocked_items:
              assert seo_builder.article_url(item) not in urls, f"quality-blocked article leaked into sitemap: {item.get('slug')}"
          assert len(urls) >= len(indexable_items) + len(topic_slugs) + len(brand_slugs) + 1, "sitemap missing article/topic/brand URLs"
          for slug in topic_slugs:
              assert f"https://spec-avtoportal.ru/topics/{slug}/" in urls, f"topic missing from sitemap: {slug}"
          assert "https://spec-avtoportal.ru/knowledge.html" in urls, "knowledge base missing from sitemap"
          assert "https://spec-avtoportal.ru/about.html" in urls, "editorial/about page missing from sitemap"
          assert "https://spec-avtoportal.ru/video.html" not in urls, "video archive must not be in sitemap"
          for slug in regulation_slugs:
              assert f"https://spec-avtoportal.ru/regulations/{slug}/" in urls, f"regulation missing from sitemap: {slug}"
          for slug in knowledge_slugs:
              assert f"https://spec-avtoportal.ru/knowledge/{slug}/" in urls, f"knowledge article missing from sitemap: {slug}"
          assert "https://spec-avtoportal.ru/brands/" in urls, "brand directory missing from sitemap"
          for slug in brand_slugs:
              assert f"https://spec-avtoportal.ru/brands/{slug}/" in urls, f"brand missing from sitemap: {slug}"

          print(f"QA OK: {len(items)} raw items, {len(indexable_items)} indexable, {len(blocked_items)} noindex, {len(pages)} pages, {linked_news_pages} news pages with knowledge links, {sat_news_pages} contextual SAT news placements, {knowledge_pages_with_news} knowledge pages with news, {len(regulation_items)} regulations, {len(urls)} sitemap URLs")
          PY
